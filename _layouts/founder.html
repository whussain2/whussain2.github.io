---
---
{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js">
  <head>
    <meta charset="utf-8">
    {% include seo.html %}
    <meta name="HandheldFriendly" content="True">
    <meta name="MobileOptimized" content="320">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070b18">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ base_path }}/assets/css/founder.css?v={{ site.time | date: "%s" }}">
    <link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png">
    {% if page.permalink == "/" %}<link rel="preload" as="image" href="https://plantnura.com/assets/images/people/team/waseem-hussain-1200.webp">{% endif %}
    <script>
      document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js';
    </script>
  </head>
  <body class="founder-site">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {{ content }}
    <script src="{{ base_path }}/assets/js/founder.js?v={{ site.time | date: "%s" }}" defer></script>
  </body>
</html>
